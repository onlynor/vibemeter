<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 与 --bg 一致：移动端浏览器的地址栏会跟着染色，不一致会露出一条边 -->
    <meta name="theme-color" content="#fbfbfd" />
    <meta name="description" content="输入关键词，跨平台采集公开评论并完成情感分析与 LLM 解读。" />
    <title>舆情洞察员 · VibeMeter</title>
    <!-- 抢在首帧之前定主题：晚一步深色用户就会看到一闪而过的白底。
         规则必须与 src/state/theme.ts 保持一致（同一个 key、同样的解析）。 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("vibe.theme.v1") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a0a0c" : "#fbfbfd");
        } catch (e) {
          /* localStorage 不可用时退回浅色，样式表的默认值即浅色 */
        }
      })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
