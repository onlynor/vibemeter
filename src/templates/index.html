{% extends "base.html" %}

{% block title %}舆情洞察员 · 首页{% endblock %}

{% block content %}
<div class="streamlit-shell" id="llm-shell">
    <aside class="llm-streamlit-sidebar" id="llm-sidebar">
        <div class="llm-sidebar-body">
            <div class="llm-sidebar-header">
                <h3 class="llm-streamlit-title mb-0">
                    <i class="bi bi-stars me-2"></i>LLM 配置
                </h3>
                <button class="btn btn-sm btn-light llm-sidebar-close" id="llm-close" type="button" aria-label="收起侧栏">
                    <i class="bi bi-chevron-double-left"></i>
                </button>
            </div>

            <div class="llm-streamlit-panel">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="llm_question">提问</label>
                    <textarea class="form-control llm-streamlit-input" id="llm_question" name="llm_question" rows="5"
                              placeholder="例如：针对这个热点的舆情分歧你怎么看？"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="llm_context_format">上下文格式</label>
                    <select class="form-select llm-streamlit-input" id="llm_context_format" name="llm_context_format">
                        <option value="xml">XML</option>
                        <option value="markdown">Markdown</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="llm_model">模型名</label>
                    <input class="form-control llm-streamlit-input" id="llm_model" name="llm_model"
                           placeholder="例如：gpt-4o-mini">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="llm_base_url">Base URL</label>
                    <input class="form-control llm-streamlit-input" id="llm_base_url" name="llm_base_url"
                           placeholder="例如：https://api.example.com/v1">
                </div>
                <div class="mb-0">
                    <label class="form-label fw-semibold" for="llm_api_key">API Key</label>
                    <input class="form-control llm-streamlit-input" id="llm_api_key" name="llm_api_key" type="password"
                           autocomplete="off" placeholder="留空则不附带 Authorization 头">
                </div>

                <div class="d-flex align-items-center gap-2 mt-3">
                    <button class="btn btn-outline-primary btn-sm" id="llm-test-btn" type="button">
                        <i class="bi bi-check2-circle me-1"></i>测试连接
                    </button>
                    <span class="llm-test-status text-muted small" id="llm-test-status"></span>
                </div>
            </div>

            <div class="llm-streamlit-preview" id="llm-preview">留空则不调用</div>
        </div>
        <div class="llm-sidebar-resizer" id="llm-sidebar-resizer" title="拖拽调整宽度，双击重置" aria-hidden="true"></div>
    </aside>

    <button class="llm-sidebar-rail" id="llm-open" type="button" aria-label="展开 LLM 侧栏">
        <i class="bi bi-chevron-double-right"></i>
        <span class="llm-rail-text">LLM</span>
    </button>

    <main class="llm-streamlit-main">
        <div class="row g-4">
            <div class="col-12">
                <div class="hero-card card border-0 shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-broadcast-pin hero-icon"></i>
                            <h2 class="card-title fw-bold ms-3 mb-0">开启一次舆情洞察</h2>
                        </div>
                        <p class="text-muted mb-4">
                            输入关键词后直接开始采集和分析。
                        </p>
                        <form id="task-form" novalidate>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="keyword">关键词</label>
                                <input class="form-control form-control-lg" id="keyword" name="keyword" required maxlength="64"
                                       placeholder="例如：AI、Agent、多智能体">
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" for="platform">数据源</label>
                                    <select class="form-select form-select-lg" id="platform" name="platform">
                                        <option value="auto">聚合搜索（推荐）</option>
                                        <option value="bilibili">B站</option>
                                        <option value="weibo">微博</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" for="count">采集数量</label>
                                    <input class="form-control form-control-lg" id="count" name="count" type="number"
                                           min="300" max="2000" step="50" value="500">
                                </div>
                            </div>
                            <div class="text-danger small mt-3 d-none" id="form-error"></div>
                            <button class="btn btn-primary btn-lg w-100 mt-4" id="submit-button" type="submit">
                                <i class="bi bi-graph-up-arrow me-2"></i>
                                <span>开始分析</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12" id="hotspot-section">
                <div class="hotspot-card card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold mb-0">实时热搜</h4>
                            <button class="btn btn-outline-secondary btn-sm" type="button" id="refresh-hotspots">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                        <div class="text-muted small py-4 text-center" id="hotspot-loading">正在获取热搜...</div>
                        <div class="text-danger small py-3 d-none" id="hotspot-error"></div>
                        <div class="hotspot-list d-none" id="hotspot-list"></div>
                    </div>
                </div>
            </div>

            <div class="col-12" id="history-section">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold mb-0">最近任务</h4>
                            <button class="btn btn-outline-secondary btn-sm" type="button" id="refresh-history" title="刷新">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                        <div class="text-muted small py-4 text-center" id="history-loading">正在加载历史任务...</div>
                        <div class="text-danger small py-3 d-none" id="history-error"></div>
                        <div class="text-muted small py-4 text-center d-none" id="history-empty">
                            还没有历史任务。新建一次分析后，结果会在这里出现。
                        </div>
                        <div class="d-none" id="history-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/index.js') }}"></script>
{% endblock %}
