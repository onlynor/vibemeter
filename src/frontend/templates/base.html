<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}舆情洞察员{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <div class="app-shell d-flex flex-column">
        <nav class="navbar navbar-dark app-navbar shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center link-reset" href="/">
                    <span class="brand-dot"></span>
                    <span class="ms-2">舆情洞察员</span>
                </a>
                <a class="navbar-text text-light small d-inline-flex align-items-center link-reset"
                   href="https://github.com/onlynor/vibemeter" target="_blank" rel="noopener" title="GitHub 仓库 onlynor/vibemeter">
                    <i class="bi bi-github me-1"></i>
                    <span>VibeMeter</span>
                </a>
            </div>
        </nav>
        <main class="flex-grow-1">
            <div class="page-container">
                {% block content %}{% endblock %}
            </div>
        </main>
        <footer class="text-center app-footer small py-4">
            <div>&copy; 2026 Sentiment Insight Platform</div>
            <div class="mt-1">
                <a class="link-reset d-inline-flex align-items-center text-muted"
                   href="https://github.com/onlynor/vibemeter" target="_blank" rel="noopener">
                    <i class="bi bi-github me-1"></i>onlynor/vibemeter
                </a>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="{{ url_for('static', path='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
