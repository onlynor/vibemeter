[project]
name = "sentiment-insight"
version = "0.1.0"
description = "Sentiment analysis platform for social media comments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sentiment Insight" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "jieba>=0.42.1",
    "snownlp>=0.12.3",
    "wordcloud>=1.9.3",
    "matplotlib>=3.8.0",
    "pydantic>=2.5.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.41.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.sources]
"src/app" = "app"

[dependency-groups]
dev = []
