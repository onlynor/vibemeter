version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: vibemeter-backend
    ports:
      - "8092:8092"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: vibemeter-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped